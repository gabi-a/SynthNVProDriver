[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SynthNVProDriver"
version = "0.1.0"
description = "Python driver for the Windfreak SynthNV Pro RF synthesizer."
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[tool.setuptools]
packages = ["SynthNVProDriver"]
